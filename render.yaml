services:
  - type: web
    name: solaris-combat-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: STATIC_DIR
        value: "/app"
      - key: MAX_WORKERS
        value: "2"
      - key: GOMAXPROCS
        value: "2"
